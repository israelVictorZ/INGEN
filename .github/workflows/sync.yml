name: Sync Riot + Twitch

# Atualiza elo, partidas e status da Twitch no banco a cada 30 minutos.
# Segredos necessários (Settings → Secrets and variables → Actions):
#   DATABASE_URL, RIOT_API_KEY  (obrigatórios)
#   TWITCH_CLIENT_ID, TWITCH_CLIENT_SECRET  (opcionais)
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch: {}

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # instala só as 4 dependências do script (~10s), não o site inteiro:
      # mantém cada execução em ~1 min e o total dentro da cota gratuita do GitHub Actions
      - run: |
          mv package.json package.json.site && rm -f package-lock.json
          npm install --no-save --no-audit --no-fund tsx@4 dotenv@18 drizzle-orm@0.45 @neondatabase/serverless@1
      - name: Sync
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$RIOT_API_KEY" ]; then
            echo "::notice::Segredos DATABASE_URL/RIOT_API_KEY ainda não configurados, pulando."
            exit 0
          fi
          npx tsx scripts/sync-riot.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          SYNC_MATCH_COUNT: "20"
