<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INGEN · Tampão de mapa</title>
<link rel="stylesheet" href="../core/ingen.css">
<style>
  /* Fluido: ocupa a fonte inteira. Use quadrado (ex.: 280×280) do tamanho do seu minimapa. */
  :root { --u: calc(min(100vw, 100vh) / 100); }
  #box { position: absolute; inset: 0; }
  #inner { position: absolute; inset: 0; overflow: hidden; }
  .bg {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 50% 50%, rgba(11, 61, 30, 0.55), transparent 62%),
      repeating-linear-gradient(0deg, rgba(38, 43, 51, 0.5) 0 1px, transparent 1px calc(var(--u) * 10)),
      repeating-linear-gradient(90deg, rgba(38, 43, 51, 0.5) 0 1px, transparent 1px calc(var(--u) * 10)),
      var(--bg1);
  }
  .team-silver .bg { background:
      radial-gradient(circle at 50% 50%, rgba(201, 205, 211, 0.12), transparent 62%),
      repeating-linear-gradient(0deg, rgba(38, 43, 51, 0.5) 0 1px, transparent 1px calc(var(--u) * 10)),
      repeating-linear-gradient(90deg, rgba(38, 43, 51, 0.5) 0 1px, transparent 1px calc(var(--u) * 10)),
      var(--bg1); }
  #rift { position: absolute; inset: 0; width: 100%; height: 100%; }
  #rift .lane { fill: none; stroke: rgba(254, 255, 250, 0.1); stroke-width: 3.2; stroke-linejoin: round; }
  #rift .flow { fill: none; stroke: var(--acc2); stroke-width: 0.7; stroke-linejoin: round; stroke-dasharray: 6 94; animation: flow 6s linear infinite; opacity: 0.85; }
  #rift .flow.b { animation-direction: reverse; stroke: var(--acc3); }
  #rift .river { fill: none; stroke: rgba(0, 240, 127, 0.18); stroke-width: 0.5; stroke-dasharray: 1.2 1.6; }
  @keyframes flow { to { stroke-dashoffset: -100; } }

  .radar { position: absolute; left: 50%; top: 50%; width: calc(var(--u) * 92); height: calc(var(--u) * 92); transform: translate(-50%, -50%); border-radius: 50%; }
  .radar i { position: absolute; left: 50%; top: 50%; border-radius: 50%; border: 1px solid rgba(61, 253, 78, 0.16); transform: translate(-50%, -50%); }
  .team-silver .radar i { border-color: rgba(201, 205, 211, 0.16); }
  .radar i:nth-child(1) { width: 100%; height: 100%; }
  .radar i:nth-child(2) { width: 68%; height: 68%; }
  .radar i:nth-child(3) { width: 36%; height: 36%; }
  .sweep {
    position: absolute; inset: 0; border-radius: 50%;
    background: conic-gradient(from 0deg, transparent 0deg 290deg, rgba(61, 253, 78, 0.04) 300deg, rgba(61, 253, 78, 0.32) 358deg, rgba(124, 249, 79, 0.75) 360deg);
    animation: sweep var(--period, 4s) linear infinite;
  }
  .team-silver .sweep { background: conic-gradient(from 0deg, transparent 0deg 290deg, rgba(201, 205, 211, 0.04) 300deg, rgba(201, 205, 211, 0.3) 358deg, rgba(241, 243, 245, 0.7) 360deg); }
  @keyframes sweep { to { transform: rotate(360deg); } }
  .blip {
    position: absolute; width: calc(var(--u) * 2.4); height: calc(var(--u) * 2.4); margin: calc(var(--u) * -1.2);
    background: var(--acc1); box-shadow: 0 0 calc(var(--u) * 2) var(--acc2);
    opacity: 0; animation: blip var(--period, 4s) linear infinite;
  }
  @keyframes blip { 0% { opacity: 1; transform: scale(1.4); } 40% { opacity: 0.15; transform: scale(1); } 100% { opacity: 0; } }

  .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: calc(var(--u) * 2); }
  .center img { width: calc(var(--u) * 52); filter: drop-shadow(0 0 calc(var(--u) * 4) rgba(4, 6, 10, 0.9)) drop-shadow(0 0 calc(var(--u) * 6) var(--glow-soft)); animation: float 5s ease-in-out infinite; }
  .center.with-name img { width: calc(var(--u) * 30); }
  .nick { font-size: calc(var(--u) * 19); white-space: nowrap; filter: drop-shadow(0 0 calc(var(--u) * 3) rgba(4, 6, 10, 0.95)); }
  @keyframes float { 50% { transform: translateY(calc(var(--u) * -1.2)); } }

  .label {
    position: absolute; left: 0; right: 0; bottom: calc(var(--u) * 5.5); text-align: center;
    font-size: calc(var(--u) * 3.6); color: var(--gray); letter-spacing: 0.22em;
  }
  .corner { position: absolute; width: calc(var(--u) * 7); height: calc(var(--u) * 7); border: 0 solid var(--acc2); }
  .corner.tr { right: calc(var(--u) * 4); top: calc(var(--u) * 4); border-top-width: 2px; border-right-width: 2px; }
  .corner.bl { left: calc(var(--u) * 4); bottom: calc(var(--u) * 4); border-bottom-width: 2px; border-left-width: 2px; }
  .corner.br { right: calc(var(--u) * 4); bottom: calc(var(--u) * 4); border-bottom-width: 2px; border-right-width: 2px; }
  .scan {
    position: absolute; left: 0; right: 0; height: calc(var(--u) * 18);
    background: linear-gradient(180deg, transparent, rgba(61, 253, 78, 0.07) 70%, rgba(124, 249, 79, 0.25) 100%);
    animation: scan 5.5s linear infinite; mix-blend-mode: screen;
  }
  @keyframes scan { from { transform: translateY(calc(var(--u) * -20)); } to { transform: translateY(calc(var(--u) * 104)); } }
</style>
</head>
<body>
<div id="box">
  <div id="inner">
    <div class="bg"></div>
    <canvas class="ig-pixels" id="px"></canvas>
    <svg id="rift" viewBox="0 0 100 100" preserveAspectRatio="none">
      <path class="river" d="M 4 4 L 96 96"/>
      <path class="lane" d="M 10 81 L 10 15 Q 10 10 15 10 L 81 10"/>
      <path class="lane" d="M 19 81 L 81 19"/>
      <path class="lane" d="M 19 90 L 85 90 Q 90 90 90 85 L 90 19"/>
      <path class="flow" pathLength="100" d="M 10 81 L 10 15 Q 10 10 15 10 L 81 10"/>
      <path class="flow b" pathLength="100" d="M 19 81 L 81 19"/>
      <path class="flow" pathLength="100" d="M 19 90 L 85 90 Q 90 90 90 85 L 90 19"/>
      <rect x="5" y="85" width="10" height="10" fill="none" stroke="var(--acc2)" stroke-width=".8"/>
      <rect x="85" y="5" width="10" height="10" fill="none" stroke="var(--acc3)" stroke-width=".8"/>
    </svg>
    <div class="radar" id="radar"><i></i><i></i><i></i><div class="sweep"></div></div>
    <div class="scan"></div>
    <div class="center" id="center"><img id="logo" alt="INGEN"></div>
    <i class="corner br"></i>
    <div class="label mono" id="label"></div>
  </div>
</div>
<script src="../config.js"></script>
<script src="../core/ingen.js"></script>
<script>
IG.ready(function () {
  /* Parâmetros: nome (mostra o nick no centro), texto (legenda; "0" esconde), time, radar=0 */
  IG.applyTeam();
  var box = document.getElementById("box");
  var inner = document.getElementById("inner");

  function step(w, h) { return Math.max(4, Math.round(Math.min(w, h) * 0.035)); }
  function stroke(w, h) { return Math.max(2, Math.round(Math.min(w, h) * 0.011)); }
  // quadrado inteiro opaco (nada do mapa vaza) + escada sólida para dentro no canto que fica de frente para o jogo
  IG.frame(box, { step: step, stroke: stroke, corners: [3, 0, 0, 0], stairs: "in", dash: 80, base: 0.7, top: true });
  void inner;

  // névoa de pixels nos cantos das bases
  var cell = Math.max(3, Math.round(Math.min(innerWidth, innerHeight) / 70));
  IG.pixelField(document.getElementById("px"), {
    cell: cell, fps: 16, noise: 1,
    colors: ["#0b3d1e", "#14652f", "#2bbf47", "#7cf94f"],
    blobs: [
      { x: 0.08, y: 0.94, r: 0.16, s: 1.15, sp: 0.2 },
      { x: 0.93, y: 0.06, r: 0.16, s: 1.15, sp: 0.18, ph: 2 },
      { x: 0.5, y: 0.5, r: 0.12, s: 0.55, sp: 0.25, ph: 1, ax: 0.2, ay: 0.2 },
    ],
  });

  // pontos no radar: piscam quando a varredura passa por eles
  var period = 4;
  var radar = document.getElementById("radar");
  if (!IG.flag("radar", true)) radar.style.display = "none";
  var pts = [[0.3, 0.28], [0.72, 0.36], [0.62, 0.74], [0.24, 0.66], [0.5, 0.18], [0.84, 0.6]];
  pts.forEach(function (p) {
    var b = IG.el("i", "blip");
    b.style.left = p[0] * 100 + "%";
    b.style.top = p[1] * 100 + "%";
    // ângulo a partir do topo, no sentido horário (igual ao conic-gradient)
    var ang = (Math.atan2(p[0] - 0.5, -(p[1] - 0.5)) * 180) / Math.PI;
    if (ang < 0) ang += 360;
    b.style.animationDelay = -((360 - ang) / 360) * period + "s";
    radar.appendChild(b);
  });

  var center = document.getElementById("center");
  document.getElementById("logo").src = IG.logoSrc();
  var nome = IG.opt("nome", "");
  if (nome) {
    center.classList.add("with-name");
    var n = IG.el("div", "nick display grad-text");
    n.textContent = nome.toUpperCase();
    if (nome.length > 7) n.style.fontSize = "calc(var(--u) * " + Math.max(9, 130 / nome.length) + ")";
    center.appendChild(n);
  }
  var texto = IG.opt("texto", "Mapa oculto");
  var label = document.getElementById("label");
  if (texto === "0") label.remove();
  else label.textContent = texto;
});
</script>
</body>
</html>
