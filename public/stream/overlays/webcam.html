<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INGEN · Borda da webcam</title>
<link rel="stylesheet" href="../core/ingen.css">
<style>
  /* Fluida: ocupa a fonte inteira. Coloque por cima da câmera com o mesmo tamanho dela. */
  :root { --u: calc(min(100vw, 100vh * 1.4) / 100); }
  #box { position: absolute; inset: 0; }
  .shade {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at 50% 45%, transparent 58%, rgba(4, 6, 10, 0.45) 100%);
  }
  .br { position: absolute; width: calc(var(--u) * 8); height: calc(var(--u) * 8); border: 0 solid; border-image: var(--grad) 1; filter: drop-shadow(0 0 4px var(--glow)); }
  .br.tr { right: calc(var(--u) * 2.6); top: calc(var(--u) * 2.6); border-top-width: max(2px, calc(var(--u) * 0.7)); border-right-width: max(2px, calc(var(--u) * 0.7)); }
  .br.bl { left: calc(var(--u) * 2.6); bottom: calc(var(--u) * 2.6); border-bottom-width: max(2px, calc(var(--u) * 0.7)); border-left-width: max(2px, calc(var(--u) * 0.7)); }

  .tag {
    position: absolute; left: 0; bottom: 0;
    display: flex; align-items: center; gap: calc(var(--u) * 1.6);
    height: max(30px, calc(var(--u) * 13.5));
    padding: 0 calc(var(--u) * 5) 0 calc(var(--u) * 2);
    background: var(--grad-x); color: var(--bg0);
    clip-path: polygon(0 0, calc(100% - var(--s) * 2) 0, calc(100% - var(--s) * 2) var(--s), calc(100% - var(--s)) var(--s), calc(100% - var(--s)) calc(var(--s) * 2), 100% calc(var(--s) * 2), 100% 100%, 0 100%);
    --s: max(4px, calc(var(--u) * 1.8));
    transform-origin: left center;
    animation: tag-in 0.9s var(--ease) 0.2s both;
  }
  .tag img { height: 70%; width: auto; filter: drop-shadow(0 0 1px rgba(4, 6, 10, 0.6)); }
  .tag .nick { font-size: max(16px, calc(var(--u) * 7)); line-height: 1; padding-top: 0.06em; white-space: nowrap; }
  .tag .team { font-family: var(--f-mono); font-weight: 700; font-size: max(8px, calc(var(--u) * 2.3)); letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.7; white-space: nowrap; }
  .tag .stack { display: flex; flex-direction: column; gap: calc(var(--u) * 0.5); }
  .tag::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(100deg, transparent 35%, rgba(255, 255, 255, 0.55) 50%, transparent 65%);
    transform: translateX(-120%); animation: shine 7s var(--ease) 1.2s infinite;
  }
  @keyframes tag-in { from { transform: translateX(-105%); } }
  @keyframes shine { 0% { transform: translateX(-120%); } 22%, 100% { transform: translateX(120%); } }

  .live {
    position: absolute; right: calc(var(--stairs, 0px) + var(--u) * 2.4); bottom: calc(var(--u) * 3.4);
    display: flex; align-items: center; gap: 0.6em;
    font-size: max(8px, calc(var(--u) * 2.4)); color: var(--white);
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
  }
</style>
</head>
<body>
<div id="box">
  <div class="shade" id="shade"></div>
  <i class="br tr"></i><i class="br bl" id="brbl"></i>
  <div class="tag" id="tag">
    <img id="logo" alt="">
    <div class="stack"><span class="nick display" id="nick"></span><span class="team" id="team"></span></div>
  </div>
  <div class="live mono" id="live"><i class="live-dot"></i>Ao vivo</div>
</div>
<script src="../config.js"></script>
<script src="../core/ingen.js"></script>
<script>
IG.ready(function () {
  /* Parâmetros: nome, time, tag=0 (esconde a etiqueta), aovivo=0, sombra=0, cantos=tl,br (degraus) */
  IG.applyTeam();
  var box = document.getElementById("box");
  var c = String(IG.opt("cantos", "tl,br")).toLowerCase();
  var corners = [c.indexOf("tl") > -1 ? 3 : 0, c.indexOf("tr") > -1 ? 3 : 0, c.indexOf("br") > -1 ? 3 : 0, c.indexOf("bl") > -1 ? 3 : 0];
  function step(w, h) { return Math.max(5, Math.round(Math.min(w, h * 1.4) * 0.022)); }
  // borda reta por cima do vídeo + escada sólida para dentro: nada de ponta preta nem quina da câmera aparecendo
  IG.frame(box, {
    step: step,
    stroke: function (w, h) { return Math.max(2, Math.round(Math.min(w, h * 1.4) * 0.009)); },
    corners: corners, stairs: "in", dash: 70, base: 0.85, top: true,
  });
  // o selo "Ao vivo" fica fora da escada do canto inferior direito
  function stairsVar() { box.style.setProperty("--stairs", (corners[2] ? corners[2] * step(innerWidth, innerHeight) + 6 : 0) + "px"); }
  stairsVar();
  addEventListener("resize", stairsVar);

  var nome = IG.opt("nome", "");
  var tag = document.getElementById("tag");
  if (!IG.flag("tag", true) || !nome) {
    tag.remove();
  } else {
    document.getElementById("logo").src = IG.logoSrc();
    document.getElementById("nick").textContent = nome.toUpperCase();
    document.getElementById("team").textContent = IG.teamName();
    document.getElementById("brbl").remove();
  }
  if (!IG.flag("aovivo", true)) document.getElementById("live").remove();
  if (!IG.flag("sombra", true)) document.getElementById("shade").remove();
});
</script>
</body>
</html>
